  <text x="450" y="465" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">View Menu</text>

  <!-- Visual Card right -->
  <rect x="740" y="150" width="380" height="480" rx="20" fill="#292524" stroke="#44403C" stroke-width="2"/>
  <circle cx="930" cy="330" r="100" fill="#F59E0B" opacity="0.15"/>
