  <text x="930" y="480" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">Table Booking Bot Active</text>
  <rect x="820" y="520" width="220" height="40" rx="20" fill="#10B981"/>
